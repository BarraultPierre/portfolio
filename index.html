<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Pierre Barrault — Composer / Purple Pain</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="description" content="Pierre Barrault — composer for video games, film, and electronic music. Bitwig." />

<!-- Favicons -->
<link rel="icon" type="image/png" sizes="32x32" href="assets/static/favicon-32x32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="assets/static/favicon-16x16.png" />
<link rel="apple-touch-icon" sizes="180x180" href="assets/static/apple-touch-icon.png" />
<link rel="icon" type="image/x-icon" href="assets/static/favicon.ico" />
<link rel="manifest" href="assets/static/site.webmanifest" />

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&display=swap"
/>

<style>
  /* ─────────────── Reset + tokens ─────────────── */
  *, *::before, *::after { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  html, body { margin: 0; padding: 0; }
  :root {
    --bg: oklch(0.155 0.006 60);
    --bg-2: oklch(0.185 0.006 60);
    --bg-3: oklch(0.22 0.006 60);
    --line: oklch(0.32 0.008 60 / 0.55);
    --line-soft: oklch(0.32 0.008 60 / 0.28);
    --fg: oklch(0.96 0.005 80);
    --fg-2: oklch(0.84 0.006 80);
    --muted: oklch(0.66 0.008 70);
    --muted-2: oklch(0.52 0.008 70);
    --accent: oklch(0.68 0.14 295);
    --accent-soft: oklch(0.68 0.14 295 / 0.18);

    --font-display: "Instrument Serif", "Times New Roman", Georgia, serif;
    --font-sans: "Geist", ui-sans-serif, system-ui, -apple-system, "Helvetica Neue", sans-serif;
    --font-mono: "Geist Mono", "JetBrains Mono", ui-monospace, monospace;

    --gutter: clamp(24px, 5vw, 80px);
    --maxw: 1320px;
  }
  html[data-font="sans-mono"] {
    --font-display: "Geist", ui-sans-serif, system-ui, sans-serif;
  }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-sans);
    font-size: 16px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
  }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
  }
  ::selection { background: var(--accent); color: oklch(0.16 0.006 60); }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  img { max-width: 100%; display: block; }
  ul { padding: 0; margin: 0; list-style: none; }

  /* ─────────────── Type utilities ─────────────── */
  .mono { font-family: var(--font-mono); letter-spacing: 0.01em; }
  .small { font-size: 12px; }
  .muted { color: var(--muted); }
  .kicker { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); margin: 0; }
  .lead { font-size: clamp(15px, 1.05vw + 11px, 18px); color: var(--fg-2); line-height: 1.55; max-width: 56ch; margin: 0; }
  .lead.small { font-size: 14px; max-width: 44ch; }
  .body { color: var(--fg-2); max-width: 60ch; margin: 16px 0 0; }
  .display-italic { font-family: var(--font-display); font-style: italic; font-weight: 400; }

  /* ─────────────── Layout ─────────────── */
  .section-eyebrow { color: var(--muted); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; margin: 0 0 18px; }
  .section-title {
    font-family: var(--font-display); font-weight: 400;
    font-size: clamp(38px, 5.5vw, 76px); line-height: 0.96;
    letter-spacing: -0.01em; margin: 0; text-wrap: balance;
  }
  .section-head {
    display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr);
    gap: 48px; align-items: end; margin-bottom: 56px;
  }
  @media (max-width: 880px) {
    .section-head { grid-template-columns: 1fr; gap: 16px; }
  }

  /* ─────────────── Header ─────────────── */
  .header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 50;
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px var(--gutter);
    backdrop-filter: blur(14px) saturate(140%);
    -webkit-backdrop-filter: blur(14px) saturate(140%);
    background: oklch(0.155 0.006 60 / 0.78);
    border-bottom: 1px solid var(--line-soft);
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 24px var(--accent); }
  .brand-mark {
    width: 28px; height: 28px; border-radius: 50%;
    display: grid; place-items: center;
    background: var(--accent-soft);
    overflow: hidden;
    box-shadow: 0 0 0 1px var(--line-soft) inset;
  }
  .brand-mark img { width: 100%; height: 100%; object-fit: contain; filter: brightness(2.2) saturate(0); opacity: 0.95; }
  .brand-name { font-weight: 500; letter-spacing: -0.01em; }
  .nav { display: flex; gap: 28px; align-items: center; }
  .nav a {
    font-size: 14px; color: var(--fg-2); position: relative; padding: 4px 0;
  }
  .nav a::after {
    content: ""; position: absolute; left: 0; right: 100%; bottom: 0;
    height: 1px; background: var(--accent); transition: right 220ms ease;
  }
  .nav a:hover { color: var(--fg); }
  .nav a:hover::after { right: 0; }
  .nav .lang-toggle { margin-left: 6px; }

  /* ─────────────── Buttons ─────────────── */
  .btn {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 14px 20px; border-radius: 999px;
    font-size: 14px; font-weight: 500; letter-spacing: -0.005em;
    border: 1px solid transparent;
    transition: transform 160ms ease, background 160ms ease, color 160ms ease, border 160ms ease;
  }
  .btn--primary { background: var(--accent); color: oklch(0.16 0.006 60); }
  .btn--primary:hover { transform: translateY(-1px); filter: brightness(1.05); }
  .btn--ghost { background: transparent; color: var(--fg); border-color: var(--line); }
  .btn--ghost:hover { border-color: var(--fg); background: oklch(0.96 0.005 80 / 0.04); }
  .btn:disabled { opacity: 0.55; cursor: not-allowed; }
  .btn:disabled:hover { transform: none; filter: none; }

  .iconbtn {
    width: 28px; height: 28px; border-radius: 999px;
    display: inline-grid; place-items: center; color: var(--fg-2);
    border: 1px solid var(--line);
    transition: color 160ms, border 160ms, background 160ms;
  }
  .iconbtn:hover { color: var(--fg); border-color: var(--fg); background: oklch(0.96 0.005 80 / 0.05); }

  /* ─────────────── Hero ─────────────── */
  .hero {
    position: relative; padding: 124px var(--gutter) 64px;
    min-height: 92vh;
    display: flex; flex-direction: column; justify-content: center;
    overflow: hidden;
  }
  .hero-bg { position: absolute; inset: 0; pointer-events: none; opacity: 0.5; }
  .hero-bg-grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(to right, var(--line-soft) 1px, transparent 1px),
      linear-gradient(to bottom, var(--line-soft) 1px, transparent 1px);
    background-size: 96px 96px;
    mask-image: radial-gradient(ellipse at 70% 30%, black 0%, transparent 70%);
    -webkit-mask-image: radial-gradient(ellipse at 70% 30%, black 0%, transparent 70%);
  }
  .hero::before {
    content: ""; position: absolute; right: -10%; top: -10%;
    width: 70%; height: 70%;
    background: radial-gradient(circle, var(--accent) 0%, transparent 60%);
    opacity: 0.16; pointer-events: none; filter: blur(40px);
  }
  .hero-grid {
    position: relative;
    display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr);
    gap: clamp(40px, 5vw, 80px); align-items: start;
  }
  @media (max-width: 1100px) { .hero-grid { grid-template-columns: 1fr; } }
  .hero-left { display: flex; flex-direction: column; justify-content: space-between; gap: 40px; }
  .hero-right { display: flex; flex-direction: column; }
  .display {
    font-family: var(--font-display); font-weight: 400;
    font-size: clamp(52px, 8.5vw, 124px); line-height: 0.94;
    letter-spacing: -0.02em; margin: 0; color: var(--fg);
  }
  .display-line { display: block; }
  .practice-list {
    display: flex; flex-direction: column; gap: 10px;
    border-top: 1px solid var(--line-soft); padding-top: 24px;
  }
  .practice-list li {
    display: grid; grid-template-columns: 50px 1fr;
    align-items: baseline;
    padding: 6px 0; border-bottom: 1px solid var(--line-soft);
  }
  .practice-num { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
  .practice-label {
    font-family: var(--font-display);
    font-size: clamp(20px, 1.7vw + 8px, 28px); line-height: 1.1;
  }
  .hero-cta { display: flex; gap: 12px; flex-wrap: wrap; }
  .hero-foot {
    position: relative; margin-top: 64px;
    display: flex; align-items: center; gap: 16px;
  }
  .hero-foot-line { flex: 1; height: 1px; background: var(--line-soft); }

  /* ─────────────── Player ─────────────── */
  .player {
    background: linear-gradient(180deg, oklch(0.2 0.006 60 / 0.7) 0%, oklch(0.16 0.006 60 / 0.9) 100%);
    border: 1px solid var(--line);
    border-radius: 18px; padding: 20px;
    display: flex; flex-direction: column; gap: 16px;
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    box-shadow: 0 24px 60px -20px oklch(0 0 0 / 0.7);
    position: relative;
  }
  .player::before {
    content: ""; position: absolute; inset: 0; border-radius: 18px;
    pointer-events: none;
    background: linear-gradient(180deg, oklch(1 0 0 / 0.04), transparent 30%);
  }
  .player-head {
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
  }
  .player-status {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 5px 10px; border-radius: 999px;
    border: 1px solid var(--line-soft); background: oklch(0.16 0.006 60 / 0.7);
  }
  .player-switch { display: flex; align-items: center; gap: 10px; color: var(--fg-2); }

  .player-poster {
    position: relative; aspect-ratio: 16 / 9;
    border-radius: 12px; overflow: hidden;
    border: 1px solid var(--line-soft);
    background: oklch(0.13 0.006 60);
  }
  .player-poster img,
  .player-poster .smart-poster { width: 100%; height: 100%; object-fit: cover; display: block; }
  .smart-poster--video { background: black; }
  .smart-poster--cover {
    position: absolute; inset: 0; z-index: 1;
    pointer-events: none;
  }

  /* Controls overlay : play + volume au même niveau, en bas-gauche */
  .poster-controls {
    position: absolute; left: 14px; bottom: 14px;
    display: flex; align-items: center; gap: 0;
    padding: 6px;
    background: oklch(0.12 0.006 60 / 0.78);
    border: 1px solid oklch(1 0 0 / 0.08);
    border-radius: 999px;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
  }

  .poster-meta {
    position: absolute; inset: 14px 14px auto auto;
    display: flex; gap: 6px;
  }
  .chip {
    display: inline-flex; align-items: center;
    padding: 5px 9px; border-radius: 999px;
    background: oklch(0.16 0.006 60 / 0.7);
    border: 1px solid var(--line-soft);
    font-size: 11px; color: var(--fg-2);
    backdrop-filter: blur(8px);
  }

  .player-info { display: flex; flex-direction: column; gap: 4px; }
  .player-title {
    font-family: var(--font-display); font-weight: 400; font-style: italic;
    font-size: clamp(40px, 3.4vw + 12px, 64px); line-height: 0.95;
    margin: 0; letter-spacing: -0.02em;
  }
  .player-poster { flex: none; }
  .yt-host { position: absolute; inset: 0; background: #000; }
  .yt-host { overflow: hidden; }
  .yt-host iframe { width: 100%; height: 100%; border: 0; pointer-events: none; display: block; transform: scale(1.03); }

  .smart-poster--cover { position: absolute; inset: 0; z-index: 1; pointer-events: none; }
  .smart-poster--cover > img, .smart-poster--cover > .poster-art { width: 100%; height: 100%; object-fit: cover; }
  .poster-controls, .prow-poster-controls, .loose-card-controls { z-index: 2; }
  /* Réduction en point pendant la lecture vidéo */
  .poster-controls, .prow-poster-controls {
    transition: opacity 360ms ease, transform 420ms cubic-bezier(.2,.7,.2,1);
  }
  .is-mini .poster-controls, .is-mini .prow-poster-controls { opacity: 0; transform: translateY(6px); pointer-events: none; }
  .is-mini { cursor: none; }
  @media (prefers-reduced-motion: reduce) { .poster-controls, .prow-poster-controls { transition: none; } }
  .reveal { display: grid; grid-template-rows: 0fr; opacity: 0; margin-top: -16px; transition: grid-template-rows 480ms cubic-bezier(.2,.7,.2,1), opacity 320ms ease, margin-top 480ms cubic-bezier(.2,.7,.2,1); }
  .reveal--open { grid-template-rows: 1fr; opacity: 1; margin-top: 0; }
  .reveal-inner { overflow: hidden; min-height: 0; padding-top: 6px; }
  .player-pitch {
    color: var(--fg-2); font-size: 14px; line-height: 1.55; margin: 0;
  }

  .player-wave { display: flex; flex-direction: column; gap: 6px; }
  .player-time { display: flex; justify-content: space-between; }

  .player-ext {
    display: inline-flex; align-items: center; gap: 6px;
    color: var(--muted); margin-left: auto;
    align-self: flex-end; width: fit-content; padding: 4px 0;
    transition: color 160ms;
  }
  .player-ext:hover { color: var(--fg); }

  /* ─────────────── Play button (3 tailles) ─────────────── */
  .playbtn {
    display: grid; place-items: center;
    border-radius: 999px;
    background: var(--accent);
    color: oklch(0.16 0.006 60);
    box-shadow: 0 8px 24px -6px var(--accent), 0 1px 0 oklch(1 0 0 / 0.2) inset;
    transition: transform 200ms cubic-bezier(.2,.8,.2,1), filter 200ms;
  }
  .playbtn:hover { transform: scale(1.05); filter: brightness(1.05); }
  .playbtn:active { transform: scale(0.97); }
  .playbtn--lg { width: 48px; height: 48px; }
  .playbtn--md { width: 40px; height: 40px; }
  .playbtn--sm { width: 32px; height: 32px; box-shadow: 0 4px 14px -4px var(--accent); }
  .playbtn--sm svg { width: 11px; height: 11px; }
  .playbtn--off {
    background: oklch(0.28 0.008 70);
    color: var(--muted);
    box-shadow: none; cursor: not-allowed;
  }
  .playbtn--off:hover { transform: none; filter: none; }
  .playbtn svg { transform: translateX(0.5px); }
  .playbtn--sm svg { transform: translateX(0.5px); }

  /* ─────────────── Volume ─────────────── */
  .volc {
    display: inline-flex; align-items: center; gap: 4px;
    max-width: 0; opacity: 0; overflow: hidden; margin-left: 0; padding: 0;
    transition: max-width 460ms cubic-bezier(.2,.7,.2,1), opacity 300ms ease, margin-left 460ms cubic-bezier(.2,.7,.2,1), padding 460ms cubic-bezier(.2,.7,.2,1);
  }
  .volc--open { max-width: 140px; opacity: 1; margin-left: 8px; padding: 0 4px 0 0; }
  @media (prefers-reduced-motion: reduce) { .volc, .reveal { transition: none; } }
  .volc-icon {
    border-radius: 6px; display: inline-grid; place-items: center;
    color: var(--fg); background: transparent; border: 0;
    transition: color 160ms, background 160ms;
  }
  .volc-icon:hover { background: oklch(1 0 0 / 0.08); }
  .volc-range {
    appearance: none; -webkit-appearance: none;
    background: transparent; margin: 0; cursor: pointer;
    opacity: 0.7; transition: opacity 180ms, width 220ms cubic-bezier(.2,.7,.2,1);
  }
  .volc--open .volc-range { opacity: 1; }

  .volc-range::-webkit-slider-runnable-track {
    height: 2px; border-radius: 999px;
    background: linear-gradient(to right, var(--fg) 0 var(--vol, 0%), oklch(1 0 0 / 0.25) var(--vol, 0%) 100%);
  }
  .volc-range::-webkit-slider-thumb {
    appearance: none; -webkit-appearance: none;
    margin-top: -4px; width: 10px; height: 10px;
    border-radius: 50%; background: var(--fg); border: 0;
    cursor: pointer; box-shadow: 0 1px 3px oklch(0 0 0 / 0.4);
  }
  .volc-range::-moz-range-track { height: 2px; background: oklch(1 0 0 / 0.25); border-radius: 999px; }
  .volc-range::-moz-range-progress { height: 2px; background: var(--fg); border-radius: 999px; }
  .volc-range::-moz-range-thumb {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--fg); border: 0; cursor: pointer;
  }

  /* Tailles spécifiques */
  .volc--lg .volc-icon { width: 32px; height: 32px; }
  .volc--lg .volc-range { width: 72px; height: 12px; }
  .volc--md .volc-icon { width: 28px; height: 28px; }
  .volc--md .volc-range { width: 52px; height: 12px; }
  .volc--sm .volc-icon { width: 26px; height: 26px; }
  .volc--sm .volc-range { width: 44px; height: 10px; }
  .volc--sm .volc-icon svg { width: 12px; height: 12px; }

  /* ─────────────── Waveform ─────────────── */
  .wf {
    position: relative; width: 100%; user-select: none; touch-action: none;
  }
  .wf-bars {
    display: flex; align-items: center; gap: 2px;
    width: 100%; height: 100%;
  }
  .wf--seek { cursor: ew-resize; }
  .wf--off { opacity: 0.55; }
  .wf-bar {
    flex: 1; min-width: 2px;
    background: oklch(0.36 0.008 70); border-radius: 1.5px;
    transition: height 200ms ease, background 120ms ease;
  }
  .wf-bar--on { background: var(--accent); }
  .wf--seek:hover .wf-bar:not(.wf-bar--on):not(.wf-bar--hov) { background: oklch(0.48 0.008 70); }
  .wf-bar--hov { background: oklch(0.58 0.008 70); }

  .wf-head {
    position: absolute; top: -3px; bottom: -3px; width: 1px;
    background: var(--accent); pointer-events: none;
    transform: translateX(-0.5px); box-shadow: 0 0 8px var(--accent);
  }
  .wf-head-thumb {
    position: absolute; top: -3px; left: 50%;
    transform: translateX(-50%);
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--accent); border: 2px solid oklch(0.16 0.006 60);
    box-shadow: 0 2px 8px oklch(0 0 0 / 0.6);
    transition: transform 160ms cubic-bezier(.2,.7,.2,1);
  }
  .wf--seek:hover .wf-head-thumb,
  .wf--drag .wf-head-thumb { transform: translateX(-50%) scale(1.3); }
  .wf-hover {
    position: absolute; top: 0; bottom: 0; width: 1px;
    background: oklch(1 0 0 / 0.3); pointer-events: none;
    transform: translateX(-0.5px);
  }

  /* ─────────────── LED status ─────────────── */
  .led {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--muted-2); display: inline-block;
  }
  .led--on { background: var(--accent); box-shadow: 0 0 12px var(--accent); animation: pulse 1.4s ease-in-out infinite; }
  .led--load { background: var(--accent); animation: blink 0.8s linear infinite; }
  @keyframes pulse { 50% { opacity: 0.55; transform: scale(0.85); } }
  @keyframes blink { 50% { opacity: 0.35; } }
  .spin { animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ─────────────── Poster placeholder art ─────────────── */
  .poster-art { position: absolute; inset: 0; overflow: hidden; }
  .poster-art::before {
    content: ""; position: absolute; inset: 0;
    background-image: repeating-linear-gradient(45deg, transparent 0 12px, oklch(1 0 0 / 0.025) 12px 13px);
    pointer-events: none;
  }
  .poster-art-bars {
    position: absolute; inset: 0;
    display: flex; align-items: flex-end; gap: 2px;
    padding: 24px; opacity: 0.85;
  }
  .poster-art-bars span { flex: 1; border-radius: 1px; }

  /* ─────────────── Projects ─────────────── */
  .projects { padding: 120px var(--gutter); border-top: 1px solid var(--line-soft); }
  .prow-list { display: flex; flex-direction: column; border-top: 1px solid var(--line-soft); }
  .prow { border-bottom: 1px solid var(--line-soft); transition: background 200ms ease; }
  .prow:hover { background: oklch(0.96 0.005 80 / 0.015); }
  .prow--open { background: oklch(0.96 0.005 80 / 0.02); }
  .prow-head {
    display: grid;
    grid-template-columns: 80px minmax(0, 2fr) minmax(0, 1.6fr) minmax(0, 1fr) 32px;
    align-items: center; gap: 24px;
    padding: 28px 8px; width: 100%; text-align: left;
    color: var(--fg);
  }
  .prow-tracks { justify-self: end; text-align: right; font-variant-numeric: tabular-nums; }
  @media (max-width: 880px) {
    .prow-head { grid-template-columns: 60px 1fr 32px; gap: 16px; }
    .prow-tag, .prow-tracks { display: none; }
  }
  .prow-year { font-size: 13px; color: var(--muted); }
  .prow-title {
    font-family: var(--font-display);
    font-size: clamp(24px, 2.4vw + 10px, 40px);
    line-height: 1; letter-spacing: -0.01em;
    display: inline-flex; align-items: center;
  }
  .prow-livedot {
    width: 7px; height: 7px; border-radius: 50%;
    margin-left: 12px;
    animation: pulse 1.4s ease-in-out infinite;
    box-shadow: 0 0 10px currentColor;
  }
  .prow-toggle {
    width: 32px; height: 32px; border-radius: 50%;
    border: 1px solid var(--line);
    display: grid; place-items: center;
    transition: border-color 220ms;
  }
  .prow-toggle span {
    width: 12px; height: 12px; border-radius: 50%;
    transition: transform 220ms ease;
  }
  .prow--open .prow-toggle { border-color: var(--accent); }
  .prow--open .prow-toggle span { transform: scale(1.4); }
  .prow-body {
    display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr);
    gap: 48px; padding: 0 8px 36px;
    animation: rowIn 280ms cubic-bezier(.2,.7,.2,1);
  }
  @keyframes rowIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
  @media (max-width: 880px) { .prow-body { grid-template-columns: 1fr; gap: 24px; } }
  .prow-pitch {
    font-family: var(--font-display);
    font-size: clamp(20px, 1.4vw + 12px, 28px);
    line-height: 1.3; color: var(--fg);
    margin: 0 0 24px; max-width: 38ch;
  }
  .prow-meta { display: flex; flex-direction: column; gap: 6px; color: var(--fg-2); font-size: 14px; margin: 0 0 20px; }
  .prow-ytlink { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); transition: color 160ms; }
  .prow-ytlink:hover { color: var(--fg); }

  .prow-body-right { display: flex; flex-direction: column; gap: 12px; }
  .prow-poster {
    position: relative; aspect-ratio: 16 / 9;
    border-radius: 10px; overflow: hidden;
    border: 1px solid var(--line-soft);
    background: oklch(0.13 0.006 60);
  }
  .prow-poster img,
  .prow-poster .smart-poster { width: 100%; height: 100%; object-fit: cover; display: block; }
  .prow-poster-controls {
    position: absolute; left: 10px; bottom: 10px;
    display: flex; align-items: center; gap: 0;
    padding: 5px;
    background: oklch(0.12 0.006 60 / 0.78);
    border: 1px solid oklch(1 0 0 / 0.08);
    border-radius: 999px;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
  }
  .prow-scrub {
    display: grid; grid-template-columns: 1fr auto;
    align-items: center; gap: 12px;
    padding: 0 4px;
  }
  .prow-time { font-variant-numeric: tabular-nums; }

  /* ─────────────── About ─────────────── */
  .about { padding: 120px var(--gutter); border-top: 1px solid var(--line-soft); }
  .about-grid {
    display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr);
    gap: clamp(40px, 5vw, 96px);
  }
  @media (max-width: 880px) { .about-grid { grid-template-columns: 1fr; } }
  .about-blocks {
    margin-top: 40px;
    display: grid; grid-template-columns: 1fr; gap: 28px;
    padding-top: 28px; border-top: 1px solid var(--line-soft);
  }
  .about-block { display: flex; flex-direction: column; gap: 10px; }
  .influences { margin: 0; color: var(--fg-2); font-size: 15px; line-height: 1.8; }
  .influence-sep { color: var(--muted-2); }
  .tools { display: flex; flex-wrap: wrap; gap: 8px; }
  .tool-chip {
    padding: 8px 14px; border: 1px solid var(--line);
    border-radius: 999px; font-family: var(--font-mono);
    font-size: 12px; color: var(--fg-2);
    background: oklch(0.18 0.006 60 / 0.5);
  }
  .tool-chip::before {
    content: ""; width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent); display: inline-block;
    margin-right: 8px; vertical-align: middle;
  }

  /* ─────────────── Loose tracks ─────────────── */
  .loose { padding: 120px var(--gutter); border-top: 1px solid var(--line-soft); }
  .loose-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 18px;
  }
  .loose-card {
    position: relative; border-radius: 14px; overflow: hidden;
    border: 1px solid var(--line-soft);
    background: oklch(0.18 0.006 60 / 0.5);
    transition: border-color 240ms;
    display: flex; flex-direction: column;
  }
  .loose-card:hover { border-color: var(--line); }
  .loose-card--live { border-color: var(--accent); }
  .loose-card-art {
    position: relative; aspect-ratio: 4 / 3; overflow: hidden;
    background: oklch(0.13 0.006 60);
  }
  .loose-card-art .smart-poster { width: 100%; height: 100%; object-fit: cover; display: block; }
  .loose-card-controls {
    position: absolute; left: 10px; bottom: 10px;
    display: flex; align-items: center; gap: 0;
    padding: 4px;
    background: oklch(0.12 0.006 60 / 0.78);
    border: 1px solid oklch(1 0 0 / 0.08);
    border-radius: 999px;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
  }
  .loose-card-meta {
    padding: 14px 16px 16px;
    display: flex; flex-direction: column; gap: 6px;
  }
  .loose-card-title {
    font-family: var(--font-display); font-size: 22px;
    letter-spacing: -0.01em;
  }
  .loose-card-second { min-height: 22px; display: flex; align-items: center; }
  .loose-card-second .wf { width: 100%; }

  /* ─────────────── Contact ─────────────── */
  .contact {
    padding: 120px var(--gutter) 32px;
    border-top: 1px solid var(--line-soft);
    position: relative; overflow: hidden;
  }
  .contact::before {
    content: ""; position: absolute; left: -10%; bottom: -20%;
    width: 80%; height: 80%;
    background: radial-gradient(circle, var(--accent) 0%, transparent 60%);
    opacity: 0.13; pointer-events: none; filter: blur(60px);
  }
  .contact-top {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 32px;
    position: relative;
  }
  .contact-top .section-eyebrow { margin: 0; }
  .contact-title {
    font-family: var(--font-display); font-weight: 400;
    font-size: clamp(40px, 6vw, 88px); line-height: 1;
    letter-spacing: -0.02em; margin: 32px 0 56px;
    text-wrap: balance; position: relative;
    max-width: 18ch;
  }
  .contact-mail {
    display: inline-flex; align-items: center; gap: 14px;
    font-family: var(--font-display);
    font-size: clamp(22px, 2vw + 10px, 36px);
    color: var(--fg);
    padding: 16px 24px;
    border: 1px solid var(--line);
    border-radius: 999px;
    transition: background 200ms, border-color 200ms;
    position: relative;
  }
  .contact-mail:hover {
    background: var(--accent); color: oklch(0.16 0.006 60); border-color: var(--accent);
  }
  .contact-socials {
    margin-top: 40px; padding-left: 25px;
    display: flex; flex-wrap: wrap; gap: 12px 28px;
    align-items: center;
    position: relative;
  }
  .contact-socials li { display: inline-flex; }
  .contact-socials a {
    display: inline-flex; gap: 8px; align-items: baseline;
    font-size: 15px; padding: 4px 0;
    border-bottom: 1px solid transparent;
    transition: border-color 160ms, color 160ms;
  }
  .contact-socials a:hover { border-bottom-color: var(--accent); }
  .contact-sacem {
    margin-top: 24px;
    padding-top: 12px; border-top: 1px solid var(--line-soft);
    position: relative;
  }

  /* ─────────────── Language toggle ─────────────── */
  .lang-toggle {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 4px 6px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: oklch(0.18 0.006 60 / 0.6);
    backdrop-filter: blur(8px);
  }
  .lang-btn {
    font-family: var(--font-mono); font-size: 11px;
    padding: 4px 10px; border-radius: 999px;
    color: var(--muted);
    transition: color 160ms, background 160ms;
  }
  .lang-btn:hover { color: var(--fg); }
  .lang-btn--on { background: var(--accent); color: oklch(0.16 0.006 60); }
  .lang-sep { color: var(--muted-2); font-size: 11px; }

  /* ─────────────── Footer ─────────────── */
  .footer {
    padding: 28px var(--gutter);
    display: flex; justify-content: space-between;
    border-top: 1px solid var(--line-soft);
  }

  /* ─────────────── Tweaks panel — dark override ─────────────── */
  .twk-panel {
    background: oklch(0.18 0.006 60 / 0.86) !important;
    color: var(--fg) !important;
    border-color: var(--line) !important;
  }
  .twk-hd b, .twk-lbl > span:first-child { color: var(--fg) !important; }
  .twk-lbl, .twk-val { color: var(--muted) !important; }

  /* ─────────────── Responsive tightening ─────────────── */
  @media (max-width: 640px) {
    .header { padding: 12px 20px; }
    .nav { gap: 18px; }
    .nav a { font-size: 13px; }
    .hero { padding-top: 96px; }
    .projects, .about, .loose { padding: 80px 20px; }
    .contact { padding: 100px 20px 80px; }
    .footer { flex-direction: column; gap: 10px; padding: 20px; }
    .poster-controls { left: 10px; bottom: 10px; }
  }
</style>
</head>
